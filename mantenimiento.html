<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>PreveSUy — Mantenimiento</title>
  <link rel="icon" type="image/png" href="/assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#faf6f0; --card:#ffffff; --ink:#3d3833; --muted:#8a7f74; --accent:#b0693f; --line:#e2d9cf; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Nunito',system-ui,sans-serif; background:var(--bg); color:var(--ink);
           min-height:100vh; display:grid; place-items:center; padding:24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:20px;
            max-width:480px; width:100%; padding:44px 36px; text-align:center;
            box-shadow:0 8px 30px rgba(61,56,51,.07); }
    .brand { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:26px; }
    .brand img { width:52px; height:52px; border-radius:50%; object-fit:cover; }
    .brand span { font-family:'Quicksand',sans-serif; font-weight:700; font-size:26px; letter-spacing:.5px; }
    h1 { font-size:20px; margin-bottom:12px; }
    p { color:var(--muted); font-size:15px; line-height:1.6; margin-bottom:10px; }
    .badge { display:inline-block; background:#f6efe7; color:var(--accent); border-radius:999px;
             font-size:13px; font-weight:700; padding:6px 16px; margin-bottom:18px; }
    .emergency { margin-top:26px; padding-top:22px; border-top:1px solid var(--line); font-size:14px; }
    .emergency strong { color:var(--accent); font-size:18px; display:block; margin-top:4px; }
    .retry { margin-top:20px; font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="/assets/img/logo.png" alt="Logo PreveSUy">
      <span>PreveSUy</span>
    </div>
    <div class="badge">Mantenimiento</div>
    <h1>Estamos trabajando para volver</h1>
    <p>La plataforma no está disponible en este momento. Estamos resolviendo el inconveniente; intentá de nuevo en unos minutos.</p>
    <div class="emergency">
      Si necesitás ayuda urgente, la línea de apoyo sigue activa:
      <strong>0800 0777</strong>
    </div>
    <p class="retry">La página se reintenta sola cada 30 segundos.</p>
  </main>
  <script src="/assets/js/mantenimiento.js" defer></script>
</body>
</html>
